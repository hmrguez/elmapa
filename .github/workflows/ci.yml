name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

# Superseded PR revisions can stop. Every channel push must finish publication.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  checks:
    name: Source checks
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      preview_run: ${{ steps.preview.outputs.preview_run }}
      preview_tag: ${{ steps.preview.outputs.preview_tag }}
      release_version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Identify documentation-only pull requests
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          # Compare the tested merge tree with its base parent, including deletions.
          if git diff --quiet --no-renames HEAD^1 HEAD -- . \
              ':(top,exclude)README.md' ':(top,exclude)CONTRIBUTING.md' \
              ':(top,exclude,glob)docs/**/*.md' ':(top,exclude)docs/images/**'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check
      - run: python3 scripts/export-icons.py --check
      - run: python3 -B scripts/test_performance_trace.py
      - run: python3 -B scripts/release/test_publish.py

      - name: Read Cargo version for publication
        id: version
        if: github.event_name == 'push'
        run: |
          version=$(python3 -B scripts/release/package.py --print-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Find verified packages for stable promotion
        id: preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/release/verified-preview.sh
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: checks
    if: needs.checks.outputs.docs_only != 'true' && needs.checks.outputs.preview_run == ''
    name: ${{ matrix.task }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        task: ${{ fromJSON(github.event_name == 'pull_request' && '["Test"]' || '["Test","Package"]') }}
    runs-on: ${{ matrix.os }}
    env:
      FULL_TEST_SUITE: ${{ matrix.task == 'Test' && (github.event_name == 'push' || matrix.os == 'ubuntu-24.04') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --no-upgrade build-essential pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxi-dev libxrandr-dev libxcursor-dev fonts-dejavu-core mesa-vulkan-drivers xvfb xauth
      - name: Install the CI Rust toolchain
        shell: bash
        env:
          # rust-cache fingerprints every installed toolchain. Keep its environment stable.
          RUSTUP_HOME: ${{ runner.temp }}/elmapa-rustup
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --no-self-update --profile minimal ${{ env.FULL_TEST_SUITE == 'true' && '--component clippy' || '' }}
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.task }}
          save-if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev') }}
      - if: env.FULL_TEST_SUITE == 'true'
        run: cargo test --locked
      - if: matrix.task == 'Test' && env.FULL_TEST_SUITE != 'true'
        run: cargo test --locked --test mcp_stdio
      - if: env.FULL_TEST_SUITE == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        if: github.event_name == 'pull_request' || matrix.task == 'Package'
        with:
          tool: cargo-about@0.9.3
      - name: Smoke-test the extracted package
        if: github.event_name == 'pull_request' || matrix.task == 'Package'
        shell: bash
        run: |
          args=(--native)
          if [[ "$RUNNER_OS" == macOS ]] && ! system_profiler SPDisplaysDataType | grep 'Metal Support' >/dev/null; then
            echo "::notice::This runner exposes no Metal display. Running the extracted app's headless export."
            args=()
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            binary=target/debug/elmapa
            if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
            args+=(--check-binary "$binary")
          fi
          case "$RUNNER_OS" in
            Linux) WGPU_FORCE_FALLBACK_ADAPTER=1 xvfb-run -a -s "-screen 0 1600x1000x24" python scripts/release/package.py "${args[@]}" ;;
            Windows) WGPU_BACKEND=dx12 WGPU_FORCE_FALLBACK_ADAPTER=1 python scripts/release/package.py "${args[@]}" ;;
            macOS) python scripts/release/package.py "${args[@]}" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.task == 'Package'
        with:
          name: package-${{ matrix.os }}
          path: target/packages/Elmapa-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish channel release
    if: >-
      ${{ !cancelled() && needs.checks.result == 'success' &&
          (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.checks.outputs.preview_run != '')) &&
          github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    needs: [checks, build]
    runs-on: ubuntu-24.04
    # Serialize stable publication for the same version so the duplicate check
    # and publication cannot race. Each preview has its own concurrency group.
    concurrency:
      group: publish-${{ github.ref_name }}-${{ github.ref_name == 'main' && needs.checks.outputs.release_version || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.checks.outputs.preview_run || github.run_id }}
          pattern: package-*
          merge-multiple: true
          path: packages
      - run: bash scripts/release/publish.sh
        env:
          RELEASE_VERSION: ${{ needs.checks.outputs.release_version }}
          PREVIEW_TAG: ${{ needs.checks.outputs.preview_tag }}
          GH_TOKEN: ${{ github.token }}

  latest:
    name: Update latest stable download
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.ref == 'refs/heads/main' }}
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Each run considers every published stable build. Coalescing pending label
    # updates is safe, while package publication itself runs for every channel push.
    concurrency:
      group: latest-main-release
      cancel-in-progress: false
    steps:
      - run: |
          stable=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          tag=$(grep -E '^main-[0-9]+-[0-9a-f]{12}$' <<< "$stable" | sort -t- -k2,2nr | sed -n '1p')
          test -n "$tag"
          gh release edit "$tag" --latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
