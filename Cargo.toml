[package]
name = "elmapa"
version = "0.4.0"
license = "MIT"
edition = "2024"
rust-version = "1.95"
description = "A quiet, procedural mapmaking studio"

[features]
default = ["app"]
# The native binary offers both the desktop editor and the stdio MCP server.
app = [
    "dep:bevy", "dep:winit", "dep:rfd", "dep:arboard",
    "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-metal", "dep:block2",
    "dep:rmcp", "dep:tokio", "dep:blake3",
    "dep:crossbeam-channel", "dep:mp4", "dep:openh264", "dep:tempfile",
]

[[bin]]
name = "elmapa"
path = "src/main.rs"
required-features = ["app"]

[[test]]
name = "mcp_stdio"
path = "tests/mcp_stdio.rs"
required-features = ["app"]

[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[dependencies]
dirs = "6"
base64 = "0.22"
i_overlay = "9.1"
image = { version = "0.25", default-features = false, features = ["png"] }
bevy = { optional = true, version = "=0.19.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_winit", "bevy_window", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render", "bevy_ui", "bevy_ui_render", "bevy_text", "default_font", "png", "x11"] }
lyon = "1"
winit = { optional = true, version = "0.30", default-features = false }
rfd = { optional = true, version = "0.15" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rand = "0.9"
rand_chacha = "0.9"
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
usvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
rmcp = { optional = true, version = "3.11", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
blake3 = { optional = true, version = "1" }
crossbeam-channel = { optional = true, version = "0.5" }
mp4 = { optional = true, version = "0.14" }
openh264 = { optional = true, version = "0.9.10" }
tempfile = { optional = true, version = "3" }
tokio = { optional = true, version = "1", default-features = false, features = ["rt", "sync"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { optional = true, version = "3.7", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.4"
objc2 = { optional = true, version = "0.6" }
objc2-app-kit = { optional = true, version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSMenu", "NSMenuItem", "NSEvent"] }
objc2-foundation = { optional = true, version = "0.3", default-features = false, features = ["std", "NSData", "NSObject", "NSString"] }
block2 = { optional = true, version = "0.6" }
objc2-metal = { optional = true, version = "0.3", default-features = false, features = ["std", "MTLDrawable", "block2", "objc2-core-foundation"] }


[profile.profiling]
inherits = "release"
debug = 1
strip = false

[profile.dev]
opt-level = 1
debug = 0
incremental = true

[profile.release]
lto = "thin"

# Keep shared specimen rasterization optimized in interactive dev builds.
[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.usvg]
opt-level = 3

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
