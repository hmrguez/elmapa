[package]
name = "elmapa"
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.95"
description = "A quiet, procedural mapmaking studio"

[build-dependencies]
serde_json = "1"

[dependencies]
dirs = "6"
base64 = "0.22"
i_overlay = "9.1"
image = { version = "0.25", default-features = false, features = ["png"] }
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_winit", "bevy_window", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render", "bevy_ui", "bevy_ui_render", "bevy_text", "default_font", "png", "x11"] }
lyon = "1"
winit = { version = "0.30", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rand = "0.9"
rand_chacha = "0.9"
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
usvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
blake3 = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { version = "3.7", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSEvent"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString"] }
block2 = "0.6"
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDrawable", "block2", "objc2-core-foundation"] }


[profile.profiling]
inherits = "release"
debug = 1
strip = false

[profile.dev]
opt-level = 1
debug = 0
incremental = true

[profile.release]
lto = "thin"

# Keep shared specimen rasterization optimized in interactive dev builds.
[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.usvg]
opt-level = 3

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
